<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>페이지 유료 전환 퍼널 · 디자인 기획 보고서</title>
<style>
:root{color-scheme:light;--ink:#16201c;--sub:#4a5a54;--muted:#7a8984;--line:#dfe6e2;--paper:#fbfbf8;--card:#fff;--accent:#165855;--accent-soft:#e6f0ec;--warn:#b0632b;--warn-soft:#f8ece2}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
main{max-width:980px;margin:auto;padding:0 24px 80px}
a{color:var(--accent);text-underline-offset:.15em}
h1,h2,h3,h4{letter-spacing:-.025em;line-height:1.25;margin:0}
p{margin:0 0 .9em}
/* 표지 */
.cover{padding:72px 0 40px;border-bottom:1px solid var(--line);margin-bottom:8px}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.cover h1{font-size:clamp(2.1rem,5.4vw,3.6rem);margin:.35em 0 .5em;font-weight:800}
.problem{font-size:clamp(1.2rem,2.6vw,1.55rem);font-weight:700;line-height:1.45;padding:22px 26px;background:var(--accent);color:#fff;border-radius:14px;margin:0 0 22px}
.problem small{display:block;font-size:.72rem;font-weight:600;letter-spacing:.12em;opacity:.75;margin-bottom:6px}
.summary{font-size:1.08rem;color:var(--sub);max-width:70ch}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.84rem;color:var(--muted);margin-top:18px}
.meta b{color:var(--sub);font-weight:600}
/* 섹션 */
section.part{padding:56px 0 8px}
.part-head{display:flex;align-items:baseline;gap:14px;margin-bottom:22px}
.num{font-size:2.4rem;font-weight:800;color:var(--accent);opacity:.25;line-height:1}
.part-head h2{font-size:1.6rem}
.lead{font-size:1.06rem;color:var(--sub);max-width:68ch;margin-bottom:22px}
/* 수치 카드 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.stat .v{font-size:2rem;font-weight:800;color:var(--accent);letter-spacing:-.03em;line-height:1.1}
.stat .l{font-size:.9rem;color:var(--sub);margin-top:6px}
/* 방법 블록 */
.method{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;margin:0 0 22px}
.method .tag{display:inline-block;font-size:.75rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;margin-bottom:10px}
.method h3{font-size:1.25rem;margin-bottom:6px}
.method .why{color:var(--sub);margin-bottom:16px}
figure{margin:0;overflow-x:auto}
figure svg{display:block;width:100%;min-width:720px;height:auto}
figure svg a{cursor:pointer}
.method .table-wrap+.reads,.method figure+.reads{margin-top:14px}
.reads{margin-top:14px;padding:14px 18px;background:var(--accent-soft);border-radius:10px;font-size:.98rem}
.reads b{color:var(--accent)}
/* 인사이트 */
.insights{display:grid;gap:14px}
.insight{display:grid;grid-template-columns:44px 1fr;gap:6px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.insight .i{font-size:1.5rem;font-weight:800;color:var(--accent)}
.insight h3{font-size:1.15rem;margin-bottom:6px}
.insight p{color:var(--sub);margin:0}
.insight .but{margin-top:8px;padding-left:10px;border-left:3px solid var(--warn);color:var(--sub)}
/* 재정의·기회 */
.reframe{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin-bottom:22px}
.reframe .box{border-radius:12px;padding:18px 20px}
.reframe .from{background:#eef0ee;color:var(--sub)}
.reframe .to{background:var(--accent);color:#fff;font-weight:700}
.reframe .box small{display:block;font-size:.72rem;letter-spacing:.1em;opacity:.75;margin-bottom:6px}
.reframe .arrow{align-self:center;font-size:1.6rem;color:var(--accent)}
.hmw{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.hmw li{background:var(--card);border:1px dashed var(--accent);border-radius:12px;padding:14px 18px;font-weight:600}
.hmw li span{display:block;font-weight:400;font-size:.85rem;color:var(--muted);margin-top:4px}
/* 방향 카드 */
.directions{display:grid;gap:18px}
.method+.directions{margin-top:4px}
.direction{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:14px;padding:24px 26px}
.direction .dn{font-size:.78rem;font-weight:700;letter-spacing:.12em;color:var(--accent)}
.direction h3{font-size:1.35rem;margin:.2em 0 .4em}
.direction .concept{font-size:1.06rem;margin-bottom:14px}
.direction dl{display:grid;grid-template-columns:120px 1fr;gap:8px 16px;margin:0}
.direction dt{font-size:.85rem;font-weight:700;color:var(--muted)}
.direction dd{margin:0}
.principles{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.principles li{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:600}
.trace{margin-top:16px;font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
/* 다음 단계 */
.next{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.next li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.next li b{color:var(--accent);margin-right:6px}
/* 배지·각주 */
.badge{display:inline-block;font-size:.68rem;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:4px;vertical-align:.12em}
.b-rec{background:#e3ece8;color:#165855}.b-int{background:#eae6f4;color:#4b3f7a}.b-hyp{background:var(--warn-soft);color:var(--warn)}.b-user{background:#eef0ee;color:var(--sub)}
sup a{text-decoration:none;font-size:.72rem;font-weight:700;padding:0 1px}
/* 표 */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--card);font-size:.93rem}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.8rem;color:var(--muted);font-weight:700;background:#f4f6f4}
/* 채택 */
.adoption{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:26px;margin-top:8px}
.adoption .basis{font-weight:700;color:var(--accent)}
.adoption h3{font-size:1.1rem;margin:22px 0 10px}
.status{display:inline-block;font-size:.75rem;font-weight:700;border-radius:4px;padding:1px 7px;background:#eef0ee;color:var(--sub)}
.status.on{background:var(--accent);color:#fff}
/* 부록 */
.appendix{margin-top:64px;border-top:2px solid var(--ink);padding-top:18px}
.appendix h2{font-size:1rem;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
details{border-bottom:1px solid var(--line);padding:12px 0}
summary{cursor:pointer;font-weight:700}
details>div{padding:12px 0;font-size:.93rem}
details h3{font-size:.95rem;margin:18px 0 8px}
details h3:first-child{margin-top:0}
details ul{margin:0;padding-left:1.2em}
details li{margin-bottom:4px}
ol.fn{padding-left:1.4em;font-size:.88rem;color:var(--sub)}
ol.fn li{margin-bottom:6px}
@media (max-width:640px){.reframe{grid-template-columns:1fr}.reframe .arrow{transform:rotate(90deg);justify-self:center}.direction dl{grid-template-columns:1fr}.insight{grid-template-columns:1fr}}
@media print{body{background:#fff}.method,.direction,.insight,.stat{break-inside:avoid}}
</style>
</head>
