name: Install smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash tests/smoke-install-linux.sh
      - run: bash tests/check-knowledge-architecture.sh
      - run: python3 -m unittest discover -s tests -p 'test_finding_history.py' -v
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: /bin/bash tests/smoke-install-macos.sh
  windows:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - shell: powershell
        run: ./tests/smoke-install-windows.ps1
