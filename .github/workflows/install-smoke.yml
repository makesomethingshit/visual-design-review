name: Install smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare font rendering tests
        if: ${{ hashFiles('tests/test_font_pairing_render.py') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-nanum fonts-dejavu-core
      - run: bash tests/smoke-install-linux.sh
      - run: bash tests/check-knowledge-architecture.sh
      - name: Check plugin distribution
        if: ${{ hashFiles('scripts/sync-codex-plugin.py') != '' }}
        run: python3 scripts/sync-codex-plugin.py --check
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: /bin/bash tests/smoke-install-macos.sh
  windows-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - shell: powershell
        run: ./tests/smoke-install-windows.ps1
      - name: Check plugin distribution on Windows checkout
        if: ${{ hashFiles('scripts/sync-codex-plugin.py') != '' }}
        shell: powershell
        run: python scripts/sync-codex-plugin.py --check
      - name: Test plugin distribution and junction protection
        if: ${{ hashFiles('tests/test_codex_plugin_distribution.py') != '' }}
        shell: powershell
        run: python -m unittest discover -s tests -p 'test_codex_plugin_distribution.py' -v
  windows:
    needs: windows-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both Windows Python versions
        env:
          WINDOWS_RESULT: ${{ needs.windows-tests.result }}
        run: test "$WINDOWS_RESULT" = success
